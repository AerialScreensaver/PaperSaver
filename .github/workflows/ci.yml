name: CI

on:
  push:
    branches: [master]
    tags: ['*']
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and test
    # The runner's default Xcode (latest stable).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build -v
      - name: Build CLI (release)
        run: swift build -c release --product papersaver
      - name: Test
        # Live suites skip unless PAPERSAVER_INTEGRATION / PAPERSAVER_MUTATION are set.
        run: swift test
      - name: CLI smoke
        run: .build/release/papersaver --version
